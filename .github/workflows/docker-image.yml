name: Docker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build containers
        run: |
          docker compose build

      - name: Start stack
        run: |
          docker compose up -d

      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do
            if docker logs smartclass-db 2>&1 | grep -q "SQL Server is now ready"; then
              echo "SQL Server ready"
              exit 0
            fi
            sleep 5
          done
          echo "SQL Server did not start in time"
          docker logs smartclass-db
          exit 1

      - name: Shutdown
        if: always()
        run: docker compose down
